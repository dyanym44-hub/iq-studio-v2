name: build-exe
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: iq_studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --onefile --windowed --name IQ_Studio main.py
      - uses: actions/upload-artifact@v4
        with:
          name: IQ_Studio_exe
          path: iq_studio/dist/IQ_Studio.exe
