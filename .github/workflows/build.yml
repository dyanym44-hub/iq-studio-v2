name: build-exe
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        shell: pwsh
        run: |
          if (Test-Path "iq_studio/main.py") { cd iq_studio }
          New-Item -ItemType Directory -Force -Path core,ui | Out-Null
          $core = "models.py","imaging.py","layout.py","exporter.py","project_io.py","settings.py","autodetect.py"
          $ui = "style.py","preview.py","editor_dialog.py","settings_dialog.py","doc_card.py","main_window.py"
          foreach ($f in $core) { if (Test-Path $f) { Move-Item $f "core/$f" -Force } }
          foreach ($f in $ui) { if (Test-Path $f) { Move-Item $f "ui/$f" -Force } }
          New-Item -ItemType File -Force -Path core/__init__.py,ui/__init__.py | Out-Null
          Get-ChildItem -Recurse core,ui | Select-Object -ExpandProperty FullName
          pip install -r requirements.txt
          pyinstaller --noconfirm --onefile --windowed --name IQ_Studio --paths . --collect-submodules core --collect-submodules ui main.py
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/out" | Out-Null
          Copy-Item dist/IQ_Studio.exe "$env:GITHUB_WORKSPACE/out/IQ_Studio.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: IQ_Studio_exe
          path: out/IQ_Studio.exe
